services:
  postgres:
    image: postgres:17-alpine
    container_name: north-monorepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: north
      POSTGRES_USER: north
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - north_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U north -d north"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  north_postgres_data:
